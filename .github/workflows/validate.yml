name: Validate

on:
  pull_request:
  push:
    branches: [main, stable]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.10.2'
          python-version: '3.13'
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/build_plugins.py --check
      - name: Verify release metadata
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --locked python - <<'PY'
          import json, os, pathlib, tomllib
          root = pathlib.Path.cwd()
          version = json.loads((root / 'catalog.json').read_text())['version']
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          assert project['version'] == version
          locked = tomllib.loads((root / 'uv.lock').read_text())['package']
          assert next(p['version'] for p in locked if p['name'] == project['name']) == version
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{version}', 'Tag must match canonical catalog version'
          PY

  blueprint-contract:
    # Unset ref or any PR (including forks) skips this layer: NOT VERIFIED.
    # Only trusted pushes may access the private sibling and its read credential.
    if: ${{ github.event_name == 'push' && vars.BLUEPRINTS_CONTRACT_REF != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate private contract checkout configuration
        shell: bash
        env:
          CONTRACT_REF: ${{ vars.BLUEPRINTS_CONTRACT_REF }}
          SHARED_REPOSITORY_READ_TOKEN: ${{ secrets.SHARED_REPOSITORY_READ_TOKEN }}
        run: |
          if [[ ! "$CONTRACT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::BLUEPRINTS_CONTRACT_REF must be a reviewed full 40-character commit SHA."
            exit 1
          fi
          if [[ -z "$SHARED_REPOSITORY_READ_TOKEN" ]]; then
            echo "::error::Set SHARED_REPOSITORY_READ_TOKEN with Contents: read access to the private project-blueprints sibling; the default GITHUB_TOKEN is current-repository scoped."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent-skills
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/project-blueprints
          ref: ${{ vars.BLUEPRINTS_CONTRACT_REF }}
          token: ${{ secrets.SHARED_REPOSITORY_READ_TOKEN }}
          path: project-blueprints
          persist-credentials: false
      - run: python3 project-blueprints/scripts/check_plugin_contract.py agent-skills
